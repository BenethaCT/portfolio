<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber-Ethereal Keyboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
    <div id="text-display">TYPE</div>
    
    <div id="keyboard-container">
        <div class="row" id="row-1"></div>
        <div class="row" id="row-2"></div>
        <div class="row" id="row-3"></div>
    </div>

    <div id="ui-bottom">
        <button class="theme-btn" onclick="setTheme('neon')">Neon Blue</button>
        <button class="theme-btn" onclick="setTheme('fire')">Solar Fire</button>
        <button class="theme-btn" onclick="setTheme('forest')">Deep Forest</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
